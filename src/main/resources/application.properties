spring.application.name=ventas
server.port=9094
spring.datasource.url=jdbc:mysql://localhost:3307/db_venta
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
logging.file.name=logs/ventas.log
springdoc.enable-hateoas=false

springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=una_clave_secreta_larga_y_segura_de_al_menos_32_bytes
eureka.instance.prefer-ip-address=true
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

services.producto.url=http://localhost:9090/api/v1/productos
services.inventario.url=http://localhost:9091/api/v1/inventario
services.usuario.url=http://localhost:9092/api/v1/auth
services.carrito.url=http://localhost:9093/api/v1/carrito